<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Boat | MarineLoRa</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* Phone Number */

        .phone-input {
            display: flex;
            align-items: center;

            background: #071521;

            border: 1px solid #294454;

            border-radius: 8px;

            overflow: hidden;
        }

        .phone-input span {
            padding: 14px;

            color: #38c7ff;

            background: #0b2638;

            font-weight: bold;
        }

        .phone-input input {
            border: none !important;

            border-radius: 0 !important;

            flex: 1;
        }


        /* OTP Box */

        .otp-box {
            margin-top: 25px;

            padding: 20px;

            background: #071521;

            border: 1px solid #38c7ff;

            border-radius: 12px;

            text-align: center;
        }

        .otp-box h3 {
            color: #38c7ff;

            margin-bottom: 10px;
        }

        .demo-otp {
            font-size: 30px;

            font-weight: bold;

            letter-spacing: 7px;

            color: white;

            background: #0b2d40;

            padding: 14px;

            border-radius: 8px;

            margin: 15px 0;
        }

        .otp-note {
            color: #91a9b9;

            font-size: 13px;
        }

    </style>

</head>


<body>


    <div class="register-page">


        <div class="register-card">


            <div class="boat-icon">
                🚤
            </div>


            <h1>
                Register Your Boat
            </h1>


            <p>
                Connect your boat to the
                Marine LoRa communication network.
            </p>


            <!-- =========================
                 BOAT DETAILS
            ========================== -->

            <label>
                Boat Name
            </label>

            <input
                type="text"
                id="boatName"
                placeholder="Enter boat name"
            >


            <label>
                Boat Number
            </label>

            <input
                type="text"
                id="boatNumber"
                placeholder="Example: TN-37-AB-1234"
            >


            <label>
                LoRa Device ID
            </label>

            <input
                type="text"
                id="loraId"
                placeholder="Example: LORA-001"
            >


            <!-- =========================
                 PHONE NUMBER
            ========================== -->

            <label>
                Owner Phone Number
            </label>


            <div class="phone-input">

                <span>
                    +91
                </span>

                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                >

            </div>


            <!-- SEND OTP -->

            <button
                onclick="sendOTP()"
                id="sendOtpButton"
            >

                SEND OTP

            </button>


            <!-- =========================
                 OTP SECTION
            ========================== -->

            <div
                id="otpSection"
                style="display:none;"
            >

                <div class="otp-box">

                    <h3>
                         Phone Verification
                    </h3>

                    <p>
                        Your demo OTP is:
                    </p>


                    <div
                        id="demoOTP"
                        class="demo-otp"
                    >
                        ------
                    </div>


                    <p class="otp-note">
                        Demo mode: no SMS is sent.
                    </p>

                </div>


                <label>
                    Enter OTP
                </label>


                <input
                    type="text"
                    id="otp"
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                >


                <button
                    onclick="verifyOTP()"
                >

                     VERIFY & CONTINUE →

                </button>

            </div>


            <a
                href="index.html"
                class="back"
            >

                ← Back to Home

            </a>


        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        let generatedOTP = "";


        // =================================
        // SEND OTP
        // =================================

        function sendOTP() {


            const boatName =
                document
                .getElementById("boatName")
                .value
                .trim();


            const boatNumber =
                document
                .getElementById("boatNumber")
                .value
                .trim();


            const loraId =
                document
                .getElementById("loraId")
                .value
                .trim();


            const phone =
                document
                .getElementById("phoneNumber")
                .value
                .trim();


            // Check boat name

            if (boatName === "") {

                alert(
                    "Please enter boat name."
                );

                return;
            }


            // Check boat number

            if (boatNumber === "") {

                alert(
                    "Please enter boat number."
                );

                return;
            }


            // Check LoRa ID

            if (loraId === "") {

                alert(
                    "Please enter LoRa Device ID."
                );

                return;
            }


            // Check phone

            if (!/^[0-9]{10}$/.test(phone)) {

                alert(
                    "Please enter a valid 10-digit phone number."
                );

                return;
            }


            // =================================
            // SAVE BOAT DETAILS
            // =================================

            localStorage.setItem(
                "boatName",
                boatName
            );


            localStorage.setItem(
                "boatNumber",
                boatNumber
            );


            localStorage.setItem(
                "loraId",
                loraId
            );


            localStorage.setItem(
                "phoneNumber",
                phone
            );


            // =================================
            // GENERATE 6 DIGIT OTP
            // =================================

            generatedOTP =
                Math.floor(
                    100000 +
                    Math.random() * 900000
                ).toString();


            // Display OTP

            document
                .getElementById("demoOTP")
                .textContent =
                generatedOTP;


            // Show OTP section

            document
                .getElementById("otpSection")
                .style.display =
                "block";


            // Change button

            document
                .getElementById("sendOtpButton")
                .textContent =
                "OTP GENERATED ✓";


            // Demo message

            alert(
                "Demo OTP generated successfully!"
            );

        }



        // =================================
        // VERIFY OTP
        // =================================

        function verifyOTP() {


            const enteredOTP =
                document
                .getElementById("otp")
                .value
                .trim();


            // Empty check

            if (enteredOTP === "") {

                alert(
                    "Please enter the OTP."
                );

                return;
            }


            // Verify

            if (
                enteredOTP === generatedOTP
            ) {


                // Save verification status

                localStorage.setItem(
                    "phoneVerified",
                    "true"
                );


                alert(
                    " Phone number verified successfully!"
                );


                // Go to tracking page

                window.location.href =
                    "tracking.html";

            }

            else {

                alert(
                    " Incorrect OTP. Please try again."
                );

            }

        }

    </script>


</body>

</html>
